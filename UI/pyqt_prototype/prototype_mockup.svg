<svg width="1180" height="760" viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1180" height="760" fill="#f6f8fc"/>

  <text x="28" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#53627a">SEQUENCER PROTOTYPE</text>
  <text x="28" y="72" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Build mathematical queries directly from Python metadata</text>
  <text x="28" y="100" font-family="Arial, sans-serif" font-size="13" fill="#53627a">A cleaner Qt Widgets direction before expanding coverage beyond point queries.</text>

  <rect x="28" y="126" width="430" height="606" rx="14" fill="#ffffff" stroke="#d7dfeb" filter="url(#shadow)"/>
  <text x="50" y="164" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Query setup</text>
  <text x="50" y="190" font-family="Arial, sans-serif" font-size="13" fill="#53627a">Choose an object, optional statistic, and generated parameters.</text>

  <text x="50" y="232" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Object</text>
  <rect x="50" y="244" width="386" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="272" font-family="Arial, sans-serif" font-size="14" fill="#111827">Parking Functions</text>
  <path d="M414 261 l7 7 l7 -7" fill="none" stroke="#475569" stroke-width="2"/>

  <text x="50" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111827">Statistic</text>
  <rect x="50" y="338" width="386" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="366" font-family="Arial, sans-serif" font-size="14" fill="#111827">Multiplicitous Count</text>
  <path d="M414 355 l7 7 l7 -7" fill="none" stroke="#475569" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <text x="50" y="421" font-size="13" font-weight="800" fill="#111827">n  *</text>
    <text x="50" y="443" font-size="12" fill="#64748b">The length of the parking function string</text>
    <rect x="50" y="458" width="386" height="44" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text x="66" y="486" font-size="14" fill="#111827">1</text>

    <text x="50" y="539" font-size="13" font-weight="800" fill="#111827">unit</text>
    <text x="50" y="561" font-size="12" fill="#64748b">If true, only consider unit parking functions</text>
    <rect x="50" y="578" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8"/>
    <text x="78" y="592" font-size="14" fill="#334155">Enabled</text>

    <text x="50" y="628" font-size="13" font-weight="800" fill="#111827">r</text>
    <text x="50" y="650" font-size="12" fill="#64748b">First r elements of parking function must be distinct</text>
  </g>

  <rect x="50" y="666" width="386" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="694" font-family="Arial, sans-serif" font-size="14" fill="#64748b">unset</text>

  <rect x="50" y="718" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="78" y="732" font-family="Arial, sans-serif" font-size="14" fill="#334155">Show generated elements</text>

  <rect x="482" y="126" width="670" height="606" rx="14" fill="#ffffff" stroke="#d7dfeb" filter="url(#shadow)"/>
  <text x="504" y="164" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Result</text>
  <text x="504" y="190" font-family="Arial, sans-serif" font-size="13" fill="#53627a">Captured command output appears here without freezing the interface.</text>

  <rect x="504" y="220" width="626" height="490" rx="12" fill="#111827" stroke="#0f172a"/>
  <text x="524" y="254" font-family="Menlo, Consolas, monospace" font-size="13" fill="#93a4c7">Run a query to see results here.</text>

  <rect x="50" y="684" width="386" height="42" rx="10" fill="#2563eb" transform="translate(0 -20)"/>
  <text x="188" y="692" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Run point query</text>
  <text x="50" y="724" font-family="Arial, sans-serif" font-size="13" fill="#53627a">Ready</text>
</svg>
