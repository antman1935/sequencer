  <path d="M256 144 l5 5 l5 -5" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="296" y="145" font-family="Arial, sans-serif" font-size="12" fill="#666">The number of positions to give a rank.</text>

  <text x="42" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333">k</text>
  <rect x="104" y="169" width="170" height="32" rx="4" fill="#fff" stroke="#aaa"/>
