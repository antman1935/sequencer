  <rect x="246" y="169" width="28" height="32" rx="3" fill="#eee" stroke="#aaa"/>
  <text x="296" y="190" font-family="Arial, sans-serif" font-size="12" fill="#666">The maximum number of positions in an individual tie.</text>

  <text x="42" y="235" font-family="Arial, sans-serif" font-size="14" fill="#333">t</text>
  <rect x="104" y="214" width="170" height="32" rx="4" fill="#fff" stroke="#aaa"/>
