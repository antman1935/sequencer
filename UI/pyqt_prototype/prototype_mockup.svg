  <text x="42" y="278" font-family="Arial, sans-serif" font-size="14" fill="#333">r</text>
  <rect x="104" y="257" width="170" height="32" rx="4" fill="#fff" stroke="#aaa"/>
  <text x="120" y="278" font-family="Arial, sans-serif" font-size="14" fill="#999">unset</text>
