<svg width="1180" height="760" viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#12203a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#315efb"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="760" fill="#f5f7fb"/>
  <circle cx="1050" cy="35" r="180" fill="#e8efff" opacity="0.75"/>
  <circle cx="115" cy="705" r="210" fill="#edf7ff" opacity="0.9"/>

  <text x="28" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#5b6b82">SEQUENCER PROTOTYPE</text>
  <text x="28" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#101828">Build mathematical queries directly from Python metadata</text>
  <text x="28" y="106" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#5b6b82">A cleaner Qt Widgets direction before expanding coverage beyond point queries.</text>

  <rect x="28" y="134" width="350" height="598" rx="18" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="50" y="174" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#101828">Query setup</text>
  <text x="50" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#667085">Choose an object, optional statistic, and parameters.</text>

  <text x="50" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#344054">Object</text>
  <rect x="132" y="222" width="212" height="44" rx="10" fill="#ffffff" stroke="#cfd8e6"/>
  <text x="148" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#182233">Fubini Rankings</text>
  <path d="M321 239 l7 7 l7 -7" fill="none" stroke="#667085" stroke-width="2"/>

  <text x="50" y="306" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#344054">Statistic</text>
  <rect x="132" y="282" width="212" height="44" rx="10" fill="#ffffff" stroke="#cfd8e6"/>
  <text x="148" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#182233">Count objects</text>
  <path d="M321 299 l7 7 l7 -7" fill="none" stroke="#667085" stroke-width="2"/>

  <line x1="50" y1="356" x2="344" y2="356" stroke="#edf1f7"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="50" y="395" font-size="14" font-weight="800" fill="#243047">n  *</text>
    <text x="50" y="415" font-size="12" fill="#667085">The number of positions to give a rank.</text>
    <rect x="50" y="430" width="294" height="44" rx="10" fill="#ffffff" stroke="#4f7cff"/>
    <text x="66" y="458" font-size="14" fill="#182233">3</text>

    <text x="50" y="513" font-size="14" font-weight="800" fill="#243047">k</text>
    <text x="50" y="533" font-size="12" fill="#667085">Maximum positions in an individual tie.</text>
    <rect x="50" y="548" width="294" height="44" rx="10" fill="#ffffff" stroke="#cfd8e6"/>
    <text x="66" y="576" font-size="14" fill="#98a2b3">unset</text>
  </g>

  <rect x="50" y="626" width="18" height="18" rx="5" fill="#ffffff" stroke="#98a2b3"/>
  <text x="82" y="641" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#344054">Show generated elements</text>

  <rect x="50" y="666" width="294" height="46" rx="12" fill="url(#button)"/>
  <text x="143" y="695" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Run point query</text>

  <rect x="402" y="134" width="750" height="598" rx="18" fill="#ffffff" stroke="#d9e2ef" filter="url(#shadow)"/>
  <text x="424" y="174" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#101828">Result</text>
  <text x="424" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#667085">Captured command output appears here without freezing the interface.</text>

  <rect x="424" y="230" width="706" height="480" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="454" cy="260" r="5" fill="#ff5f57"/>
  <circle cx="474" cy="260" r="5" fill="#febc2e"/>
  <circle cx="494" cy="260" r="5" fill="#28c840"/>
  <text x="454" y="317" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" fill="#dbeafe">Point Query on FubiniRankings(n:3).</text>
  <text x="454" y="351" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="15" fill="#93c5fd">|FubiniRankings(n:3)| = 13</text>

  <text x="28" y="748" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#667085">Static mockup of the polished UI/pyqt_prototype/main.py layout.</text>
</svg>
